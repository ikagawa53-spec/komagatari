<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15151b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="コマ語り">
<title>コマ語り 話ごと感想帳</title>
<meta name="description" content="漫画の話ごとに感想と★評価を言い合える非公式の感想帳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: 気軽な読者同士のおしゃべり帳。にぎやかすぎず、読みやすく。
IDEA: 漫画の原稿用紙とコマ割り。話数はコマ、感想は吹き出し。
PICTURE: 話数グリッド(感想数で墨の濃さが変わるコマ)と吹き出し型の感想。
COLOUR and TYPE: 原稿用紙の白、墨 #1b1b22、朱 #e2402c をひとつ。Dela Gothic One + Zen Kaku Gothic New。
LAYOUT: 上部に細い帯、1カラム最大880px、スマホ優先。
*/
:root{color-scheme:light dark;--bg:light-dark(#fbfaf6,#15151b);--ink:light-dark(#1b1b22,#ecebe6);--sub:light-dark(#62616b,#a4a3ad);--line:light-dark(#1b1b22,#ecebe6);--soft:light-dark(#efede5,#22222b);--card:light-dark(#fff,#1c1c24);--red:#e2402c;--tone:light-dark(#1b1b22,#ecebe6)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Zen Kaku Gothic New",system-ui,sans-serif;overflow-x:clip}
header{border-bottom:3px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
.hd{max-width:880px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{font:24px/1 "Dela Gothic One",sans-serif;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px}
.logo i{display:inline-block;width:22px;height:22px;background:var(--red);border:3px solid var(--line);transform:rotate(-6deg)}
.hd small{color:var(--sub);font-size:13px;margin-left:auto;text-align:right}
main{max-width:880px;margin:auto;padding:20px 16px 80px}
h1{font:clamp(26px,6vw,40px)/1.15 "Dela Gothic One",sans-serif;margin:6px 0 10px;text-wrap:balance}
h2{font:20px/1.3 "Dela Gothic One",sans-serif;margin:28px 0 10px}
.muted{color:var(--sub);font-size:14px}
input,textarea,select{font:16px "Zen Kaku Gothic New",sans-serif;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:44px}
textarea{min-height:110px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
button{font:700 15px "Zen Kaku Gothic New",sans-serif;min-height:44px;padding:0 18px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pri{background:var(--ink);color:var(--bg)}
button.red{background:var(--red);color:#fff;border-color:var(--line)}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>input{flex:1 1 200px}
.note{border:2px dashed var(--sub);border-radius:10px;padding:12px 14px;color:var(--sub);font-size:14px;margin:14px 0}
.works{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));margin-top:14px}
.work{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:4px;padding:14px;box-shadow:5px 5px 0 var(--line);transition:transform .12s}
.work:hover{transform:translate(-2px,-2px)}
.work b{display:block;font-size:18px;line-height:1.35;margin-bottom:6px}
.work span{font-size:13px;color:var(--sub)}
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--sub);text-decoration:none;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:12px}
.ep{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1/1;border:2px solid var(--line);text-decoration:none;color:var(--ink);background:var(--card);font-weight:700;font-size:18px;line-height:1.1}
.ep small{font-size:12px;font-weight:500;color:var(--sub);margin-top:3px}
.ep.h1{background:color-mix(in srgb,var(--tone) 14%,var(--card))}
.ep.h2{background:color-mix(in srgb,var(--tone) 32%,var(--card))}
.ep.h3{background:var(--tone);color:var(--bg)}.ep.h3 small{color:var(--bg)}
.ep.new::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:14px;height:14px;border:2px solid var(--line);vertical-align:-2px;margin-right:4px}
.epnav{display:flex;justify-content:space-between;gap:8px;margin:6px 0 4px}
.epnav a{flex:1;text-align:center;border:2px solid var(--line);border-radius:8px;min-height:44px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);font-weight:700;background:var(--card)}
.epnav a[aria-disabled=true]{opacity:.35;pointer-events:none}
.stat{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;margin:4px 0 14px}
.stat b{font:30px/1 "Dela Gothic One",sans-serif}
.stars{color:var(--red);letter-spacing:2px;white-space:nowrap}
form.post{background:var(--card);border:3px solid var(--line);border-radius:4px;padding:14px;display:grid;gap:10px;box-shadow:5px 5px 0 var(--line)}
.starpick{display:flex;gap:2px}
.starpick button{border:0;background:none;font-size:28px;min-height:44px;width:44px;padding:0;color:var(--sub)}
.starpick button.on{color:var(--red)}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;min-height:44px}
.chk input{width:22px;height:22px;min-height:0;accent-color:var(--red)}
.cmts{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:16px}
.bub{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px;margin-left:10px}
.bub::before{content:"";position:absolute;left:-12px;top:18px;width:16px;height:16px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg) skew(10deg,10deg)}
.bub .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--sub);margin-bottom:4px}
.bub .meta b{color:var(--ink);font-size:14px}
.bub p{margin:0;white-space:pre-wrap;word-break:break-word}
.spo p{filter:blur(6px);user-select:none;cursor:pointer}
.spo .tag{background:var(--red);color:#fff;border-radius:4px;padding:0 6px;font-weight:700}
.del{margin-left:auto;min-height:32px;padding:0 10px;font-size:13px;border-width:1px}
.sort{display:flex;gap:6px;margin-top:20px}
.sort button{min-height:36px;font-size:13px;padding:0 12px}
.sort button.on{background:var(--ink);color:var(--bg)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.work,.toast{transition:none}}
header{padding-top:env(safe-area-inset-top)}
main{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
#inst{display:none;min-height:36px;padding:0 12px;font-size:13px;background:var(--red);color:#fff;flex:none}
#inst.on{display:inline-block}
@media(display-mode:standalone){body{-webkit-tap-highlight-color:transparent}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;cursor:pointer}
.chip small{font-weight:500;color:var(--sub)}
.chips.ep .chip{border-style:dashed}
.chip.add{border-style:dashed;color:var(--sub);font-weight:500}
.chip.pick.on{background:var(--red);border-color:var(--red);color:#fff}
.prog{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);border-radius:8px;padding:6px 6px 6px 14px;font-weight:700;margin:4px 0 10px}
.prog button{min-height:36px;margin-left:auto;font-size:13px}
.ep.rd{box-shadow:inset 0 -5px 0 var(--red)}
.hits{display:grid;gap:8px}
.hit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 14px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);text-decoration:none}
.hit span{grid-column:1;font-size:14px;color:var(--sub)}.hit .n{grid-column:2;grid-row:1/3;align-self:center;color:var(--ink);font-weight:700}
.hit .blur{filter:blur(4px)}
.tag{background:var(--red);color:#fff;border-radius:4px;padding:0 6px;font-weight:700;font-style:normal;font-size:12px}
.hl{font:20px/1.4 "Dela Gothic One",sans-serif;margin:6px 0 10px}
.hlf input{flex:1 1 200px}
.gate{border:3px solid var(--line);background:var(--card);padding:18px;border-radius:4px;box-shadow:5px 5px 0 var(--line);margin-top:12px}
.gate b{font:20px/1.3 "Dela Gothic One",sans-serif}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
.sheet{background:var(--bg);color:var(--ink);width:min(560px,100%);border:3px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.apps{margin:4px 0 6px}.apps .chips{margin-top:4px}
.ep.bmk::before{content:"◆";position:absolute;top:2px;left:5px;font-size:11px;color:var(--red)}
.hit.bm{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}.hit.bm a{color:var(--ink);text-decoration:none}
.go{color:var(--red)!important;font-weight:700;text-decoration:none}
.bmbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:4px 0 8px}
.jo{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:14px;margin:0 0 12px}.jo a{color:var(--red);font-weight:700}
</style>
</head>
<body>
<header><div class="hd"><a class="logo" href="#top"><i></i>コマ語り</a><button id="inst" type="button">アプリとして追加</button><small>漫画の「この話」の感想を言い合う場所<br>※各配信アプリとは無関係の非公式サイト</small></div></header>
<main id="app"><p class="muted">読み込み中…</p></main>
<div class="toast" id="toast" role="status"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, getDoc, getDocs, onSnapshot, query, where, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase設定(公開して問題ない値)
const firebaseConfig = {
  apiKey: "AIzaSyCeau3wB2ZsUUfV8k-SJXh4EgA4l_VRn6c",
  authDomain: "komagatari-af475.firebaseapp.com",
  projectId: "komagatari-af475",
  storageBucket: "komagatari-af475.firebasestorage.app",
  messagingSenderId: "100781524904",
  appId: "1:100781524904:web:2f011520e9c414c046bf9d"
};

// ===== タグ一覧(ここを書き換えるだけで変更できます) =====
const WORK_TAGS = ['覚醒','成り上がり','復讐','異世界','転生','バトル','恋愛','胸キュン','ダーク','ほのぼの','ギャグ','頭脳戦','ミステリー','泣ける','作画が神','ハッピーエンド'];
const EP_TAGS   = ['クライマックス','涙腺崩壊','覚醒','名バトル','伏線回収','胸アツ','神作画','ざまぁ','衝撃展開','胸キュン','爆笑','鬱展開'];
const APPS      = ['ピッコマ','LINEマンガ','めちゃコミック','コミックシーモア','ebookjapan','マンガワン','少年ジャンプ+','マガポケ','サイコミ','comico','Kindle','紙の単行本','その他'];
const MAX_WT = 5, MAX_ET = 3, MAX_APP = 3;   // 1人が選べる数(作品タグ / 話タグ / 読んだアプリ)
// ===========================================================
const ALL_TAGS = [...new Set([...WORK_TAGS, ...EP_TAGS])];

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').normalize('NFKC').replace(/\s+/g,'').toLowerCase();
const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('on'),2600); };
const ms = v => v && v.toMillis ? v.toMillis() : (typeof v==='number' ? v : Date.now());
const ago = t => { const d=(Date.now()-t)/1000; if(d<60) return 'たった今'; if(d<3600) return Math.floor(d/60)+'分前'; if(d<86400) return Math.floor(d/3600)+'時間前'; if(d<86400*30) return Math.floor(d/86400)+'日前'; const x=new Date(t); return `${x.getFullYear()}/${x.getMonth()+1}/${x.getDate()}`; };
const starStr = n => '★'.repeat(n)+'☆'.repeat(5-n);
const ls = { get:k=>{ try{return localStorage.getItem(k)||''}catch(e){return ''} }, set:(k,v)=>{ try{localStorage.setItem(k,v)}catch(e){} } };

let db=null, me=null, setupErr='';
let works=[], worksReady=false, worksErr='';
let cur=null, unsubs=[], cmts=[], cmtReady=false, tvW=[], hlW={}, raW=[], joW=[];
let allHl=[], allTv=null, allTvAt=0, tvLoading=false, allRa=null, allRaAt=0, raLoading=false;
let sortMode='new', q='', draftStar=0, revealed=new Set(), peek=new Set(), askedProg=new Set(), hlMine={};

// ===== どこまで読んだ(この端末にだけ保存) =====
const prog = wid => { const v=ls.get('rd:'+wid); if(!v) return null; if(v==='all') return {all:true,n:Infinity}; if(v==='later') return {later:true,n:0}; return {n:+v||0}; };
const setProg = (wid,v) => ls.set('rd:'+wid, String(v));
const isRead = (wid,ep) => { const p=prog(wid); return (!!p && (p.all || ep<=p.n)) || peek.has(wid+'_'+ep); };
const bumpProg = (wid,ep) => { const p=prog(wid); if(p&&p.all) return; if(!p||p.later||ep>p.n) setProg(wid,ep); };
const progLabel = p => !p ? 'どこまで読んだか未設定' : p.all ? '最新話まで読んだ' : p.later ? 'どこまで読んだか未設定' : p.n===0 ? 'まだ読んでいない' : `第${p.n}話まで読んだ`;

// ===== しおり(この端末にだけ保存) =====
const MAX_LEAD = 10;   // 何話前まで選べるか
const bms = wid => { try{ return JSON.parse(ls.get('bm:'+wid)||'[]'); }catch(e){ return []; } };
const saveBms = (wid,arr) => ls.set('bm:'+wid, JSON.stringify(arr.sort((a,b)=>a.ep-b.ep)));
const myBm = (wid,ep) => bms(wid).find(b=>b.ep===ep);
const joStat = ep => { const l=joW.filter(d=>d.ep===ep).map(d=>d.lead); if(!l.length) return null; const avg=l.reduce((a,b)=>a+b,0)/l.length; return {n:l.length, avg, from:Math.max(1,ep-Math.round(avg))}; };

// ===== モーダル =====
const modal=document.createElement('div'); modal.id='modal'; document.body.append(modal);
const closeModal=()=>{ modal.className=''; modal.innerHTML=''; };
const openModal=(html,bind)=>{ modal.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; modal.className='on'; modal.onclick=e=>{ if(e.target===modal) closeModal(); }; bind&&bind(modal); };

function route(){
  const h=location.hash.slice(1);
  let m=h.match(/^w-([A-Za-z0-9_-]+)-e-(\d+)$/); if(m) return {v:'ep',id:m[1],ep:+m[2]};
  m=h.match(/^w-([A-Za-z0-9_-]+)$/); if(m) return {v:'work',id:m[1]};
  m=h.match(/^t-(\d+)$/); if(m) return {v:'tag',i:+m[1]};
  m=h.match(/^a-(\d+)$/); if(m) return {v:'app',i:+m[1]};
  return {v:'home'};
}

function watchWork(id){
  if(cur===id) return;
  unsubs.forEach(u=>u()); unsubs=[]; cur=id; cmts=[]; cmtReady=false; tvW=[]; hlW={}; raW=[]; joW=[];
  const tm=setTimeout(()=>{ if(!cmtReady){ cmtReady='slow'; render(); } },10000);
  unsubs.push(onSnapshot(query(collection(db,'c'),where('w','==',id)), s=>{
    cmts=s.docs.map(d=>{ const x=d.data(); return {id:d.id,...x,at:ms(x.at)}; }); cmtReady=true; clearTimeout(tm); render();
  }, ()=>{ clearTimeout(tm); cmtReady=true; toast('感想を読み込めませんでした'); render(); }));
  unsubs.push(onSnapshot(query(collection(db,'tv'),where('w','==',id)), s=>{ tvW=s.docs.map(d=>d.data()); render(); }, ()=>{}));
  unsubs.push(onSnapshot(query(collection(db,'jo'),where('w','==',id)), s=>{ joW=s.docs.map(d=>d.data()); render(); }, ()=>{}));
  unsubs.push(onSnapshot(query(collection(db,'ra'),where('w','==',id)), s=>{ raW=s.docs.map(d=>d.data()); render(); }, ()=>{}));
  unsubs.push(onSnapshot(query(collection(db,'hl'),where('w','==',id),where('ok','==',true)), s=>{ hlW={}; s.docs.forEach(d=>{const x=d.data(); hlW[x.ep]=x.text;}); render(); }, ()=>{}));
}

// タグ集計
const countTags = (docs,ep,list) => { const m={}; docs.forEach(d=>{ if(d.ep===ep) (d.tags||[]).forEach(t=>{ if(list.includes(t)) m[t]=(m[t]||0)+1; }); }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
const myTags = ep => (tvW.find(d=>d.by===me && d.ep===ep)||{}).tags||[];
const chips = (arr,more='') => arr.length ? `<div class="chips">${arr.map(([t,n])=>`<a class="chip" href="#t-${ALL_TAGS.indexOf(t)}">${esc(t)}<small>${n}</small></a>`).join('')}${more}</div>` : more?`<div class="chips">${more}</div>`:'';

function render(){
  const r=route();
  if(setupErr){ app.innerHTML=`<h1>準備中です</h1><div class="note">${esc(setupErr)}</div>`; return; }
  if(r.v==='home') return home();
  if(r.v==='tag') return tagView(r.i);
  if(r.v==='app') return appView(r.i);
  const w=works.find(x=>x.id===r.id);
  if(!w){ app.innerHTML = worksReady ? `<a class="back" href="#top">← 作品一覧へ</a><h1>作品が見つかりません</h1><p class="muted">削除されたか、リンクが間違っているかもしれません。</p>` : `<p class="muted">読み込み中…</p>`; return; }
  watchWork(w.id);
  r.v==='work' ? workView(w) : epView(w, r.ep);
}

function home(){
  // 入力欄は作り直さない(日本語変換が消えないように、結果の部分だけ更新)
  if(!$('#addf')){
    app.innerHTML=`
  <h1>読んだ話の感想、<br>ここで言い合おう。</h1>
  <p class="muted">作品と話数をそろえて登録すると、話ごとに感想・★評価・タグを付けられます。登録不要・誰でも使えます。作品名は配信アプリの表記どおりに入れると探しやすくなります。</p>
  <form id="addf" class="row" style="margin-top:14px">
    <input id="q" placeholder="作品名・見出し・タグで検索 / 作品を登録" autocomplete="off" aria-label="検索">
    <input id="neps" type="number" min="1" max="3000" inputmode="numeric" placeholder="最新話数" style="flex:0 1 120px" aria-label="最新話数">
    <button class="pri" id="addb">作品を登録</button>
  </form>
  <div id="res"></div>`;
    const qi=$('#q'); qi.value=q;
    qi.addEventListener('input',()=>{ q=qi.value; homeRes(); });
    qi.addEventListener('compositionend',()=>{ q=qi.value; homeRes(); });
    $('#addf').onsubmit=async e=>{
      e.preventDefault();
      const title=$('#q').value.trim(), eps=parseInt($('#neps').value,10);
      if(!title) return toast('作品名を入れてください');
      const dup=works.find(w=>norm(w.title)===norm(title));
      if(dup){ location.hash='w-'+dup.id; return; }
      if(!(eps>=1 && eps<=3000)) return toast('最新話数(1〜3000)を入れてください');
      try{ const ref=doc(collection(db,'works')); await setDoc(ref,{title:title.slice(0,80),eps,by:me,at:serverTimestamp(),n:0}); q=''; location.hash='w-'+ref.id; toast('登録しました'); }
      catch(err){ handleErr(err); }
    };
  }
  $('#addb').disabled=!me;
  homeRes();
}

function homeRes(){
  const res=$('#res'); if(!res) return;
  const nq=norm(q);
  const list=works.filter(w=>!nq || norm(w.title).includes(nq)).sort((a,b)=>(b.last||b.at||0)-(a.last||a.at||0));
  const tagHits=nq?ALL_TAGS.filter(t=>norm(t).includes(nq)):[];
  const hlHits=nq?allHl.filter(h=>norm(h.text).includes(nq)).slice(0,20):[];
  const title=id=>(works.find(w=>w.id===id)||{}).title||'';
  res.innerHTML=`
  ${worksErr?`<div class="note">${esc(worksErr)}</div>`:''}
  ${tagHits.length?`<div class="chips" style="margin-top:12px">${tagHits.map(t=>`<a class="chip" href="#t-${ALL_TAGS.indexOf(t)}">${esc(t)} のタグで探す</a>`).join('')}</div>`:''}
  ${!worksReady?'<p class="muted">作品を読み込み中…</p>': !works.length?'<div class="note">まだ作品がありません。上の欄に作品名と最新話数を入れて、最初の1作品を登録してください。</div>': (!list.length&&!hlHits.length&&!tagHits.length)?`<div class="note">「${esc(q)}」は見つかりません。作品名なら、最新話数を入れて「作品を登録」を押すと追加できます。</div>`:''}
  <div class="works">${list.map(w=>`<a class="work" href="#w-${w.id}"><b>${esc(w.title)}</b><span>全${w.eps}話 ・ 感想 ${w.n||0}件${w.last?' ・ '+ago(w.last):''}</span></a>`).join('')}</div>
  ${hlHits.length?`<h2>見出しが一致した回</h2><div class="hits">${hlHits.map(h=>`<a class="hit" href="#w-${h.w}-e-${h.ep}"><b>${esc(title(h.w))}</b><span>第${h.ep}話「${esc(h.text)}」</span></a>`).join('')}</div>`:''}
  ${!nq?`<h2>タグから探す</h2><p class="muted">上が作品のタグ、下が「この回が熱い」話のタグです。</p><div class="chips">${WORK_TAGS.map(t=>`<a class="chip" href="#t-${ALL_TAGS.indexOf(t)}">${esc(t)}</a>`).join('')}</div><div class="chips ep">${EP_TAGS.map(t=>`<a class="chip" href="#t-${ALL_TAGS.indexOf(t)}">${esc(t)}</a>`).join('')}</div><h2>読んだアプリから探す</h2><div class="chips">${APPS.map((a,i)=>`<a class="chip" href="#a-${i}">${esc(a)}</a>`).join('')}</div>`:''}`;
}

function tagView(i){
  const tag=ALL_TAGS[i];
  if(!tag){ location.hash='top'; return; }
  const isW=WORK_TAGS.includes(tag), isE=EP_TAGS.includes(tag);
  if(!allTv || Date.now()-allTvAt>60000){
    app.innerHTML=`<a class="back" href="#top">← 作品一覧へ</a><h1>#${esc(tag)}</h1><p class="muted">読み込み中…</p>`;
    if(!tvLoading){ tvLoading=true; getDocs(collection(db,'tv')).then(s=>{ allTv=s.docs.map(d=>d.data()); }).catch(()=>{ allTv=[]; }).finally(()=>{ allTvAt=Date.now(); tvLoading=false; render(); }); }
    return;
  }
  const W={}, E={};
  allTv.forEach(d=>{ if(!(d.tags||[]).includes(tag)) return; if(d.ep===0) W[d.w]=(W[d.w]||0)+1; else { const k=d.w+'_'+d.ep; E[k]=(E[k]||0)+1; } });
  const wl=Object.entries(W).filter(([id])=>works.some(w=>w.id===id)).sort((a,b)=>b[1]-a[1]||((works.find(w=>w.id===b[0])||{}).n||0)-((works.find(w=>w.id===a[0])||{}).n||0)).slice(0,30);
  const el=Object.entries(E).filter(([k])=>works.some(w=>w.id===k.split('_')[0])).sort((a,b)=>b[1]-a[1]).slice(0,50);
  const hlOf=(w,ep)=>(allHl.find(h=>h.w===w&&h.ep===ep)||{}).text;
  const T=id=>(works.find(w=>w.id===id)||{});
  app.innerHTML=`<a class="back" href="#top">← 作品一覧へ</a>
  <h1>#${esc(tag)}</h1>
  ${isW?`<h2>このタグが付いた作品</h2>${wl.length?`<div class="hits">${wl.map(([id,n])=>`<a class="hit" href="#w-${id}"><b>${esc(T(id).title)}</b><span>全${T(id).eps}話 ・ 感想${T(id).n||0}件</span><span class="n">${n}票</span></a>`).join('')}</div>`:'<div class="note">まだこのタグが付いた作品はありません。作品ページから付けられます。</div>'}`:''}
  ${isE?`<h2>このタグが付いた回</h2><p class="muted">まだ読んでいない回は、見出しを隠しています。</p>${el.length?`<div class="hits">${el.map(([k,n])=>{ const [id,ep]=k.split('_'); const e=+ep, rd=isRead(id,e), h=hlOf(id,e);
      return `<a class="hit" href="#w-${id}-e-${e}"><b>${esc(T(id).title)}</b><span>第${e}話${h?(rd?`「${esc(h)}」`:' <em class="tag">未読</em>'):(rd?'':' <em class="tag">未読</em>')}</span><span class="n">${n}票</span></a>`; }).join('')}</div>`:'<div class="note">まだこのタグが付いた回はありません。話のページから付けられます。</div>'}`:''}`;
}

const myApps = () => (raW.find(d=>d.by===me)||{}).apps||[];
const countApps = docs => { const m={}; docs.forEach(d=>(d.apps||[]).forEach(a=>{ if(APPS.includes(a)) m[a]=(m[a]||0)+1; })); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
async function saveApps(w, sel){
  const ref=doc(db,'ra',`${me}_${w.id}`);
  try{ if(sel.length) await setDoc(ref,{w:w.id,by:me,apps:sel}); else await deleteDoc(ref); allRa=null; return true; }catch(err){ handleErr(err); return false; }
}
const appPicker = (sel, onChange) => m => { const box=m.querySelector('#ap'); if(!box) return;
  const draw=()=>{ box.innerHTML=APPS.map(a=>`<button type="button" class="chip pick ${sel.includes(a)?'on':''}" data-a="${esc(a)}">${esc(a)}</button>`).join('');
    box.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{ const a=b.dataset.a; if(sel.includes(a)) sel.splice(sel.indexOf(a),1); else if(sel.length<MAX_APP) sel.push(a); else return toast(`選べるのは${MAX_APP}つまでです`); onChange&&onChange(); draw(); }); };
  draw(); };

function appSheet(w){
  const sel=[...myApps()];
  openModal(`<h2 style="margin-top:0">どのアプリで読んでいますか？</h2><p class="muted">${MAX_APP}つまで選べます。作品ページに「よく読まれているアプリ」として表示されます。</p><div class="chips" id="ap"></div>
    <div class="row" style="margin-top:12px"><button class="red" id="apok" ${me?'':'disabled'}>保存</button><button id="apx">閉じる</button></div>`,
  m=>{ appPicker(sel)(m); m.querySelector('#apx').onclick=closeModal;
    m.querySelector('#apok').onclick=async()=>{ if(await saveApps(w,sel)){ closeModal(); toast('保存しました'); } }; });
}

function appView(i){
  const a=APPS[i]; if(!a){ location.hash='top'; return; }
  if(!allRa || Date.now()-allRaAt>60000){
    app.innerHTML=`<a class="back" href="#top">← 作品一覧へ</a><h1>${esc(a)}で読まれている作品</h1><p class="muted">読み込み中…</p>`;
    if(!raLoading){ raLoading=true; getDocs(collection(db,'ra')).then(s=>{ allRa=s.docs.map(d=>d.data()); }).catch(()=>{ allRa=[]; }).finally(()=>{ allRaAt=Date.now(); raLoading=false; render(); }); }
    return;
  }
  const W={}; allRa.forEach(d=>{ if((d.apps||[]).includes(a)) W[d.w]=(W[d.w]||0)+1; });

  const wl=Object.entries(W).filter(([id])=>T(id)).sort((x,y)=>y[1]-x[1]||(T(y[0]).n||0)-(T(x[0]).n||0)).slice(0,50);
  app.innerHTML=`<a class="back" href="#top">← 作品一覧へ</a><h1>${esc(a)}で読まれている作品</h1>
  ${wl.length?`<div class="hits">${wl.map(([id,n])=>`<a class="hit" href="#w-${id}"><b>${esc(T(id).title)}</b><span>全${T(id).eps}話 ・ 感想${T(id).n||0}件</span><span class="n">${n}人</span></a>`).join('')}</div>`:'<div class="note">まだ登録がありません。作品ページの「読んだアプリ」から選べます。</div>'}`;
}

function bmSheet(w,ep){
  const cur0=myBm(w.id,ep); let lead=cur0?ep-cur0.from:3; lead=Math.min(lead,ep-1);
  const st=joStat(ep);
  const draw=m=>{ m.querySelector('#ld').innerHTML=Array.from({length:Math.min(MAX_LEAD,ep-1)+1},(_,i)=>`<button type="button" class="chip pick ${i===lead?'on':''}" data-l="${i}">${i===0?'この話から':i+'話前'}</button>`).join('');
    m.querySelector('#ldx').textContent=lead===0?`第${ep}話から読む`:`第${ep-lead}話から読み始めて、第${ep}話で最高の瞬間へ`;
    m.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ lead=+b.dataset.l; draw(m); }); };
  openModal(`<h2 style="margin-top:0">第${ep}話にしおりを付ける</h2>
    <p class="muted">何回でも見直したい回に。何話前から読み直すと最高の流れになりますか？</p>
    <div class="chips" id="ld"></div><p id="ldx" style="font-weight:700;margin:4px 0 12px"></p>
    ${st?`<p class="muted">みんなは平均${st.avg.toFixed(1)}話前から読み直しています(${st.n}人)</p>`:''}
    <label for="bmm" class="muted">自分だけのメモ(ほかの人には見えません)</label>
    <textarea id="bmm" maxlength="100" style="min-height:70px" placeholder="例: 師匠の最後のセリフで泣く">${esc(cur0?cur0.memo:'')}</textarea>
    <div class="row" style="margin-top:12px"><button class="red" id="bmok">保存</button>${cur0?'<button id="bmdel">しおりを外す</button>':''}<button id="bmx">閉じる</button></div>`,
  m=>{ draw(m); m.querySelector('#bmx').onclick=closeModal;
    m.querySelector('#bmok').onclick=async()=>{
      const arr=bms(w.id).filter(b=>b.ep!==ep); arr.push({ep,from:ep-lead,memo:m.querySelector('#bmm').value.trim().slice(0,100),at:Date.now()}); saveBms(w.id,arr);
      closeModal(); toast('しおりを付けました'); render();
      if(me) setDoc(doc(db,'jo',`${me}_${w.id}_${ep}`),{w:w.id,ep,by:me,lead}).catch(()=>{});
    };
    const d=m.querySelector('#bmdel'); if(d) d.onclick=()=>{ saveBms(w.id,bms(w.id).filter(b=>b.ep!==ep)); closeModal(); toast('しおりを外しました'); render();
      if(me) deleteDoc(doc(db,'jo',`${me}_${w.id}_${ep}`)).catch(()=>{}); };
  });
}

function epStats(){
  const m={};
  cmts.forEach(c=>{ const s=m[c.ep]||(m[c.ep]={n:0,last:0}); s.n++; s.last=Math.max(s.last,c.at||0); });
  return m;
}

function progSheet(w, first){
  const p=prog(w.id), maxEp=w.eps;
  openModal(`<h2 style="margin-top:0">${first?'どこまで読みましたか？':'読んだところを変更'}</h2>
    <p class="muted">まだ読んでいない回の感想・タグ・見出しは、ぼかして表示します。記録はこの端末にだけ保存されます。</p>
    <div class="row"><span>第</span><input id="pg" type="number" min="1" max="${maxEp}" inputmode="numeric" value="${p&&!p.all&&p.n?p.n:''}" style="flex:1 1 100px" aria-label="読んだ話数"><span>話まで</span><button class="pri" id="pgok">決定</button></div>
    <div class="row" style="margin-top:10px"><button id="pgall">最新話まで全部</button><button id="pgnone">まだ読んでいない</button>${first?'<button id="pglater">あとで</button>':'<button id="pgx">閉じる</button>'}</div>
    ${first?`<h3 style="margin:18px 0 0">どのアプリで読んでいますか？<small class="muted">(任意・${MAX_APP}つまで)</small></h3><div class="chips" id="ap"></div>`:''}`,
  m=>{
    const sel=[...myApps()]; let touched=false; appPicker(sel,()=>touched=true)(m);
    const done=v=>{ setProg(w.id,v); if(touched) saveApps(w,sel); closeModal(); render(); };
    m.querySelector('#pgok').onclick=()=>{ const n=parseInt(m.querySelector('#pg').value,10); if(!(n>=1)) return toast('話数を入れてください'); done(n); };
    m.querySelector('#pgall').onclick=()=>done('all');
    m.querySelector('#pgnone').onclick=()=>done(0);
    const l=m.querySelector('#pglater'); if(l) l.onclick=()=>done('later');
    const x=m.querySelector('#pgx'); if(x) x.onclick=closeModal;
  });
}

function tagSheet(w, ep){
  const list=ep===0?WORK_TAGS:EP_TAGS, max=ep===0?MAX_WT:MAX_ET;
  let sel=myTags(ep).filter(t=>list.includes(t));
  const draw=m=>{ m.querySelector('#tg').innerHTML=list.map(t=>`<button type="button" class="chip pick ${sel.includes(t)?'on':''}" data-t="${esc(t)}">${esc(t)}</button>`).join(''); m.querySelector('#tgn').textContent=`${sel.length} / ${max}`;
    m.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{ const t=b.dataset.t; if(sel.includes(t)) sel=sel.filter(x=>x!==t); else if(sel.length<max) sel.push(t); else return toast(`選べるのは${max}つまでです`); draw(m); }); };
  openModal(`<h2 style="margin-top:0">${ep===0?'この作品のタグ':`第${ep}話のタグ`}</h2><p class="muted">当てはまるものを${max}つまで選んでください。みんなの票が多いタグほど上に表示されます。<span id="tgn"></span></p><div class="chips" id="tg"></div>
    <div class="row" style="margin-top:12px"><button class="red" id="tgok" ${me?'':'disabled'}>保存</button><button id="tgx">閉じる</button></div>`,
  m=>{ draw(m); m.querySelector('#tgx').onclick=closeModal;
    m.querySelector('#tgok').onclick=async()=>{ const ref=doc(db,'tv',`${me}_${w.id}_${ep}`);
      try{ if(sel.length) await setDoc(ref,{w:w.id,ep,by:me,tags:sel}); else await deleteDoc(ref); allTv=null; closeModal(); toast('タグを保存しました'); if(ep>0) bumpProg(w.id,ep); }catch(err){ handleErr(err); } };
  });
}

function workView(w){
  const st=epStats(), now=Date.now(), p=prog(w.id), bmSet=new Set(bms(w.id).map(b=>b.ep));
  const maxEp=Math.max(w.eps, ...Object.keys(st).map(Number));
  const cells=Array.from({length:maxEp},(_,i)=>{ const e=i+1, s=st[e]; const lv=!s?'':s.n>=6?'h3':s.n>=3?'h2':'h1';
    return `<a class="ep ${lv} ${s&&now-s.last<86400000?'new':''} ${isRead(w.id,e)?'rd':''} ${bmSet.has(e)?'bmk':''}" href="#w-${w.id}-e-${e}" aria-label="第${e}話 感想${s?s.n:0}件">${e}<small>${s?s.n+'件':'—'}</small></a>`; }).join('');

  app.innerHTML=`<a class="back" href="#top">← 作品一覧へ</a>
  <h1>${esc(w.title)}</h1>
  <div class="prog"><span>${progLabel(p)}</span><button type="button" id="pged">変更</button></div>
  <div class="stat"><span><b>${maxEp}</b> 話</span><span><b>${cmts.length}</b> 件の感想</span></div>
  ${chips(countTags(tvW,0,WORK_TAGS), `<button type="button" class="chip add" id="wtag">＋ 作品タグを付ける</button>`)}
  <div class="apps"><span class="muted">読まれているアプリ</span><div class="chips">${countApps(raW).map(([a,n])=>`<a class="chip" href="#a-${APPS.indexOf(a)}">${esc(a)}<small>${n}人</small></a>`).join('')}<button type="button" class="chip add" id="wapp">${myApps().length?'✎ 自分の読んだアプリを変更':'＋ 読んだアプリを選ぶ'}</button></div></div>
  ${bms(w.id).length?`<h2>あなたのしおり</h2><div class="hits">${bms(w.id).map(b=>`<div class="hit bm"><a href="#w-${w.id}-e-${b.ep}"><b>第${b.ep}話${hlW[b.ep]?`「${esc(hlW[b.ep])}」`:''}</b></a>${b.memo?`<span>${esc(b.memo)}</span>`:''}<a class="go" href="#w-${w.id}-e-${b.from}">▶ 第${b.from}話から読む</a></div>`).join('')}</div>`:''}
  ${hotL.length?`<h2>盛り上がった回</h2><div class="hits">${hotL.map(([e])=>{ e=+e; const rd=isRead(w.id,e), tg=countTags(tvW,e,EP_TAGS).slice(0,3);
     return `<a class="hit" href="#w-${w.id}-e-${e}"><b>第${e}話</b>${rd?`<span>${hlW[e]?`「${esc(hlW[e])}」 `:''}${tg.map(([t])=>'#'+esc(t)).join(' ')}</span>`:'<span class="blur">まだ読んでいない回のため非表示</span>'}</a>`; }).join('')}</div>`:''}
  <h2>話数</h2>
  <form id="epf" class="row">
    <input id="epn" type="number" min="1" inputmode="numeric" placeholder="話数を入力してジャンプ" style="flex:1 1 180px" aria-label="話数">
    <button class="pri">開く</button>
    <button type="button" id="bump" ${me?'':'disabled'}>最新話を更新</button>
  </form>
  <div class="legend"><span><i style="background:var(--card)"></i>感想なし</span><span><i style="background:color-mix(in srgb,var(--tone) 32%,var(--card))"></i>にぎわい中</span><span><i style="background:var(--tone)"></i>6件以上</span><span><i style="background:var(--card);box-shadow:inset 0 -4px 0 var(--red)"></i>読んだ回</span><span><i style="background:var(--red);border-radius:50%;border:0"></i>24時間以内に投稿</span><span><i style="border:0;background:none;color:var(--red);font-style:normal;width:auto;height:auto">◆</i>しおり</span></div>
  ${cmtReady==='slow'?'<div class="note">感想の読み込みに時間がかかっています。少し待つか、通信状態を確認してください。</div>':''}
  <div class="grid">${cells}</div>`;
  $('#pged').onclick=()=>progSheet(w,false);
  $('#wtag').onclick=()=>tagSheet(w,0);

  $('#bump').onclick=()=>{
    const f=$('#epf'); if(f.querySelector('#newEp')) return;
    f.insertAdjacentHTML('beforeend',`<div class="row" style="flex-basis:100%"><input id="newEp" type="number" min="${w.eps}" max="3000" value="${w.eps+1}" inputmode="numeric" aria-label="新しい最新話数" style="flex:1 1 160px"><button type="button" class="red" id="saveEp">この話数にする</button></div>`);
    $('#saveEp').onclick=async()=>{ const n=parseInt($('#newEp').value,10); if(!(n>=w.eps&&n<=3000)) return toast(`${w.eps}〜3000で入れてください`);
      try{ await updateDoc(doc(db,'works',w.id),{eps:n}); toast(`全${n}話に更新しました`); }catch(err){ handleErr(err); } };
  };
  if(!p && !askedProg.has(w.id)){ askedProg.add(w.id); progSheet(w,true); }
}

async function checkMyHl(w,ep){
  const k=w.id+'_'+ep; if(k in hlMine) return; hlMine[k]='?';
  try{ const s=await getDoc(doc(db,'hl',k)); hlMine[k]=s.exists()?(s.data().ok?'ok':'mine'):'none'; }catch(e){ hlMine[k]='taken'; }
  if(route().v==='ep') render();
}

function epView(w, ep){
  const maxEp=Math.max(w.eps,ep);
  const nav=`<a class="back" href="#w-${w.id}">← ${esc(w.title)} の話数一覧</a><h1>第${ep}話</h1>
  <div class="epnav"><a href="#w-${w.id}-e-${ep-1}" aria-disabled="${ep<=1}">← 第${Math.max(1,ep-1)}話</a><a href="#w-${w.id}-e-${ep+1}" aria-disabled="${ep>=maxEp}">第${ep+1}話 →</a></div>`;
  if(!isRead(w.id,ep)){
    app.innerHTML=nav+`<div class="gate"><b>まだ読んでいない回です</b><p>第${ep}話の見出し・タグ・感想にはネタバレが含まれます。${progLabel(prog(w.id))}になっています。</p>
      <div class="row"><button class="red" id="gread">読んだので表示する</button><button id="gpeek">今回だけ見る</button><a class="back" href="#w-${w.id}">話数一覧へ戻る</a></div></div>`;
    $('#gread').onclick=()=>{ bumpProg(w.id,ep); render(); };
    $('#gpeek').onclick=()=>{ peek.add(w.id+'_'+ep); render(); };
    return;
  }
  const list=cmts.filter(c=>c.ep===ep).sort((a,b)=> sortMode==='new' ? (b.at||0)-(a.at||0) : (b.star||0)-(a.star||0)||(b.at||0)-(a.at||0));
  const rated=list.filter(c=>c.star), avg=rated.length? rated.reduce((s,c)=>s+c.star,0)/rated.length : 0;
  const hk=w.id+'_'+ep, hs=hlMine[hk];
  if(!hlW[ep]) checkMyHl(w,ep);
  const hlBox = hlW[ep] ? `<p class="hl">「${esc(hlW[ep])}」</p>`
    : hs==='mine'||hs==='taken' ? `<p class="muted">見出しは提案済みで、確認待ちです。</p>`
    : hs==='none' ? `<form id="hlf" class="row hlf"><input id="hlt" maxlength="30" placeholder="見出しを提案(例: 〇〇vs△△)" aria-label="見出し"><button ${me?'':'disabled'}>提案</button></form><p class="muted" style="margin-top:4px">見出しは管理者が確認してから表示されます。</p>` : '';
  app.innerHTML=nav+`${hlBox}
  <div class="stat"><span><b>${list.length}</b> 件</span>${rated.length?`<span class="stars">${starStr(Math.round(avg))}</span><span class="muted">平均 ${avg.toFixed(1)}(${rated.length}人)</span>`:'<span class="muted">まだ評価なし</span>'}</div>
  ${chips(countTags(tvW,ep,EP_TAGS), `<button type="button" class="chip add" id="etag">＋ この回にタグを付ける</button>`)}
  ${(()=>{ const b=myBm(w.id,ep), st=joStat(ep);
    return `<div class="bmbar"><button type="button" class="${b?'red':''}" id="bmb">${b?'◆ しおり済み(変更)':'◇ しおりを付ける'}</button>${b&&b.from<ep?`<a class="go" href="#w-${w.id}-e-${b.from}">▶ 第${b.from}話から読み直す</a>`:''}</div>
    ${st&&st.from<ep?`<p class="jo">この回は、みんな平均${st.avg.toFixed(1)}話前から読み直しています。<a href="#w-${w.id}-e-${st.from}">第${st.from}話から読むのがおすすめ</a>(${st.n}人)</p>`:''}`; })()}
  <form class="post" id="pf">
    <label for="tx" style="font-weight:700">第${ep}話の感想を書く</label>
    <input id="nm" maxlength="20" placeholder="ニックネーム(空欄なら「名無しの読者」)" value="${esc(ls.get('nick'))}" aria-label="ニックネーム">
    <div class="starpick" role="group" aria-label="評価">${[1,2,3,4,5].map(i=>`<button type="button" data-s="${i}" class="${i<=draftStar?'on':''}" aria-label="${i}つ星">★</button>`).join('')}<span class="muted" style="align-self:center;margin-left:6px">${draftStar?draftStar+'つ星(もう一度押すと解除)':'評価は任意'}</span></div>
    <textarea id="tx" maxlength="1000" placeholder="この話のどこが良かった？ 気になった展開は？"></textarea>
    <div class="row"><label class="chk"><input type="checkbox" id="sp">この先の話のネタバレを含む(ぼかして表示)</label><button class="red" style="margin-left:auto" ${me?'':'disabled'}>投稿する</button></div>
  </form>
  <div class="sort" role="group" aria-label="並び替え"><button data-m="new" class="${sortMode==='new'?'on':''}">新しい順</button><button data-m="star" class="${sortMode==='star'?'on':''}">評価が高い順</button></div>
  ${!cmtReady?'<p class="muted">感想を読み込み中…</p>':cmtReady==='slow'?'<div class="note">感想の読み込みに時間がかかっています。</div>':''}
  ${cmtReady===true&&!list.length?'<div class="note">まだ感想がありません。最初のひとことをどうぞ。</div>':''}
  <ul class="cmts">${list.map(c=>{ const sp=c.sp&&!revealed.has(c.id);
    return `<li class="bub ${sp?'spo':''}" data-id="${c.id}"><div class="meta"><b>${esc(c.name||'名無しの読者')}</b>${c.star?`<span class="stars">${starStr(c.star)}</span>`:''}<span>${ago(c.at||0)}</span>${c.sp?'<span class="tag">ネタバレ</span>':''}${c.by===me?`<button class="del" data-del="${c.id}">削除</button>`:''}</div><p ${sp?'title="タップで表示"':''}>${esc(c.text)}</p></li>`; }).join('')}</ul>`;
  const tx=$('#tx'); tx.value=ls.get('d:'+w.id+':'+ep);
  tx.oninput=()=>ls.set('d:'+w.id+':'+ep,tx.value);
  $('#etag').onclick=()=>tagSheet(w,ep);
  $('#bmb').onclick=()=>bmSheet(w,ep);
  const hf=$('#hlf'); if(hf) hf.onsubmit=async e=>{ e.preventDefault(); const t=$('#hlt').value.trim(); if(!t) return toast('見出しを入れてください');
    try{ await setDoc(doc(db,'hl',hk),{w:w.id,ep,text:t.slice(0,30),by:me,ok:false,at:serverTimestamp()}); hlMine[hk]='mine'; toast('提案しました。確認後に表示されます'); epView(w,ep); }
    catch(err){ hlMine[hk]='taken'; toast('すでに提案されています'); epView(w,ep); } };
  app.querySelectorAll('.starpick button').forEach(b=>b.onclick=()=>{ const s=+b.dataset.s; draftStar= draftStar===s?0:s; const v=tx.value, n=$('#nm').value; epView(w,ep); $('#tx').value=v; $('#nm').value=n; });
  app.querySelectorAll('.sort button').forEach(b=>b.onclick=()=>{ sortMode=b.dataset.m; epView(w,ep); });
  app.querySelectorAll('.spo p').forEach(p=>p.onclick=()=>{ revealed.add(p.closest('li').dataset.id); epView(w,ep); });
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(b.dataset.ok!=='1'){ b.dataset.ok='1'; b.textContent='本当に削除'; b.classList.add('red'); return; }
    try{ await deleteDoc(doc(db,'c',b.dataset.del)); await updateDoc(doc(db,'works',w.id),{n:increment(-1)}).catch(()=>{}); toast('削除しました'); }catch(err){ handleErr(err); }
  });
  $('#pf').onsubmit=async e=>{
    e.preventDefault(); const text=tx.value.trim(); if(!text) return toast('感想を入力してください');
    const name=$('#nm').value.trim().slice(0,20); ls.set('nick',name);
    const btn=e.target.querySelector('.red'); btn.disabled=true;
    try{
      await addDoc(collection(db,'c'),{w:w.id,ep,text:text.slice(0,1000),star:draftStar,sp:$('#sp').checked,name,by:me,at:serverTimestamp()});
      ls.set('d:'+w.id+':'+ep,''); draftStar=0; bumpProg(w.id,ep); toast('投稿しました');
      await updateDoc(doc(db,'works',w.id),{n:increment(1),last:serverTimestamp(), ...(ep>w.eps?{eps:ep}:{})}).catch(()=>{});
    }catch(err){ handleErr(err); btn.disabled=false; }
  };
}

function handleErr(err){
  const c=err&&err.code||'';
  if(c.includes('permission')) toast('保存できない内容でした(文字数・話数などを確認してください)');
  else if(c.includes('resource-exhausted')) toast('混み合っています。少し待ってから試してください');
  else toast('保存できませんでした。通信状態を確認してください');
}

// アプリ化(PWA)
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
let deferred=null; const ib=$('#inst');
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferred=e; ib.classList.add('on'); });
ib.onclick=async()=>{ if(!deferred) return; deferred.prompt(); await deferred.userChoice.catch(()=>{}); deferred=null; ib.classList.remove('on'); };
window.addEventListener('appinstalled',()=>{ ib.classList.remove('on'); toast('ホーム画面に追加しました'); });

// 閲覧数カウント(管理画面でだけ見られる)
const ymd=()=>{ const d=new Date(); return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); };
let trackQ=[];
function track(){
  if(!me){ trackQ.push(1); return; }
  const r=route(), day=ymd(), wid=((r.v==='work'||r.v==='ep')&&/^[A-Za-z0-9_-]+$/.test(r.id))?r.id:null;
  const first=ls.get('vd')!==day; if(first) ls.set('vd',day);
  const data={pv:increment(1)}; if(first) data.uv=increment(1); if(wid) data.w={[wid]:increment(1)};
  setDoc(doc(db,'stats','d-'+day),data,{merge:true}).catch(()=>{});
}
window.addEventListener('hashchange',()=>{ window.scrollTo(0,0); draftStar=0; closeModal(); render(); if(db) track(); });

{
  const fb=initializeApp(firebaseConfig);
  db=getFirestore(fb);
  const auth=getAuth(fb);
  onAuthStateChanged(auth,u=>{
    if(u){ me=u.uid; render(); if(trackQ.length){ trackQ=[]; track(); } }
    else signInAnonymously(auth).catch(()=>toast('匿名ログインに失敗しました(Firebaseで匿名認証を有効にしてください)'));
  });
  track();
  const tm=setTimeout(()=>{ if(!worksReady){ worksReady=true; worksErr='作品一覧の読み込みに時間がかかっています。通信状態を確認してください。'; render(); } },10000);
  onSnapshot(collection(db,'works'), s=>{
    works=s.docs.map(d=>{ const x=d.data(); return {id:d.id,...x,at:ms(x.at),last:x.last?ms(x.last):0}; });
    worksReady=true; worksErr=''; clearTimeout(tm); render();
  }, e=>{ clearTimeout(tm); worksReady=true; worksErr='作品一覧を読み込めませんでした。'; render(); });
  getDocs(query(collection(db,'hl'),where('ok','==',true))).then(s=>{ allHl=s.docs.map(d=>d.data()); if(route().v==='home'&&q) render(); }).catch(()=>{});
  render();
}
</script>
</body>
</html>
